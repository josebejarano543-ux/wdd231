<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Jose Bejarano">
  <meta name="description" content="Explore modern and comfortable room options at Silver Sage Motel in Duchesne, Utah.">
  <meta property="og:title" content="Silver Sage Motel Rooms">
  <meta property="og:description" content="View comfortable rooms and amenities at Silver Sage Motel.">
  <meta property="og:type" content="website">
  <title>Silver Sage Motel | Rooms</title>
  <link rel="stylesheet" href="styles/styles.css">
  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/rooms.js"></script>
</head>

<body>
  <header>
    <nav class="navbar">
      <a class="logo" href="index.html">Silver Sage</a>
      <button id="menu-button" aria-label="Open navigation menu">☰</button>

      <ul id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="rooms.html" class="active">Rooms</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <p class="eyebrow">Silver Sage Motel</p>
      <h1>Choose Your Perfect Stay</h1>
      <p>
        Browse comfortable room options designed for travelers, families,
        and guests visiting Duchesne, Utah.
      </p>
    </section>

    <section class="filter-box">
      <label for="room-filter">Filter rooms by type</label>
      <select id="room-filter">
        <option value="all">All Rooms</option>
        <option value="queen">Queen Rooms</option>
        <option value="double">Double Queen Rooms</option>
        <option value="king">King Rooms</option>
        <option value="suite">Suites</option>
      </select>
    </section>

    <section id="rooms-container" class="room-grid">
      <!-- Rooms are loaded here with JavaScript -->
    </section>
  </main>

  <dialog id="room-modal">
    <div id="modal-content"></div>
    <button id="close-modal" class="button">Close</button>
  </dialog>

  <footer>
    <p>&copy; <span id="year"></span> Silver Sage Motel | Jose Bejarano</p>
    <p>
      <a href="attributions.html">Attributions</a> |
      <a href="siteplan.html">Site Plan</a> |
      <a href="#">Video Demo</a>
    </p>
    <p id="visit-message"></p>
  </footer>
</body>
</html>
