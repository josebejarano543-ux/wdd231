<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Jose Bejarano">
<meta name="description" content="Contact Silver Sage Motel in Duchesne, Utah.">
<title>Silver Sage Motel | Contact</title>

<link rel="stylesheet" href="styles/styles.css">

<script type="module" src="scripts/main.js"></script>
<script type="module" src="scripts/form.js"></script>
</head>

<body>

<header>
<nav class="navbar">
<a class="logo text-logo" href="index.html">Silver Sage</a>

<button id="menu-button">☰</button>

<ul id="nav-menu">
<li><a href="index.html">Home</a></li>
<li><a href="rooms.html">Rooms</a></li>
<li><a href="contact.html" class="active">Contact</a></li>
</ul>
</nav>
</header>

<main>

<section class="page-title">
<h1>Contact Us</h1>
<p>Questions, reservations, and travel assistance for your stay in Duchesne, Utah.</p>
</section>

<section class="contact-layout">

<form class="contact-form"
      action="form-action.html"
      method="get">

<label for="first">First Name</label>
<input type="text" id="first" name="first" required>

<label for="last">Last Name</label>
<input type="text" id="last" name="last" required>

<label for="email">Email</label>
<input type="email" id="email" name="email" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone">

<label for="message">Message</label>
<textarea id="message"
          name="message"
          rows="5"
          required></textarea>

<button class="button" type="submit">
Send Message
</button>

</form>

<div class="contact-card">

<h2>Silver Sage Motel</h2>

<p>
Duchesne, Utah
</p>

<p>
Phone: (435) 555-2026
</p>

<p>
Email: info@silversagemotel.com
</p>

<p>
Open 24 Hours
</p>

</div>

</section>

</main>

<footer>
<p>&copy; <span id="year"></span> Silver Sage Motel</p>
</footer>

</body>
</html>
